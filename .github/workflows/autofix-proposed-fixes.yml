name: Autofix after pipeline

on:
  workflow_run:
    workflows:
      - "Python Security Scan (Bandit + Safety)"
      - "DAST - OWASP ZAP Scan"
      - "DAST - OWASP ZAP Active Scan"
      - "CodeQL Analysis (SAST)"
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  security-events: write
  contents: write
  pull-requests: write

concurrency:
  group: autofix-${{ github.repository }}
  cancel-in-progress: false

jobs:
  gate-and-autofix:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check scans, generate fixes, and open a review PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python3 .github/scripts/autofix.py
